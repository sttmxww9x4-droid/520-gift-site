<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送给最爱的你 - 520</title>
  <style>
    :root {
      --bg1: #080603;
      --bg2: #1a1209;
      --gold: #ffd18a;
      --gold-light: #ffe6b9;
      --text: #fff8ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: radial-gradient(circle at 50% 0%, #2b2012 0%, var(--bg2) 28%, var(--bg1) 75%, #020202 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      position: relative;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 30px 45px, rgba(255, 228, 170, 0.7), transparent),
        radial-gradient(1px 1px at 180px 80px, rgba(255, 225, 168, 0.75), transparent),
        radial-gradient(1px 1px at 290px 140px, rgba(255, 243, 205, 0.7), transparent),
        radial-gradient(2px 2px at 350px 30px, rgba(255, 216, 146, 0.7), transparent);
      background-size: 380px 220px;
      animation: skyMove 18s linear infinite;
      opacity: 0.32;
      pointer-events: none;
    }

    @keyframes skyMove {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }

    .wrap {
      position: relative;
      width: min(94vw, 700px);
      text-align: center;
      z-index: 2;
    }

    .heart-scene {
      position: relative;
      width: min(92vw, 520px);
      height: min(64vw, 360px);
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 20px rgba(255, 214, 147, 0.42));
      animation: float 3.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #heartCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 213, 145, 0.2);
      border-radius: 50%;
      transform: scale(0.35);
      opacity: 0;
      animation: pulse 3s ease-out infinite;
      pointer-events: none;
    }

    .ring:nth-child(2) { animation-delay: 0.6s; }
    .ring:nth-child(3) { animation-delay: 1.2s; }

    @keyframes pulse {
      0% { transform: scale(0.35); opacity: 0.4; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    h1 {
      font-size: clamp(1.8rem, 4.7vw, 2.7rem);
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 0 16px rgba(255, 210, 146, 0.6);
    }

    .msg {
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      line-height: 1.8;
      opacity: 0.95;
      padding: 0 10px;
    }

    .highlight {
      color: #ffe2b1;
      font-weight: 700;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #f8d5a1;
      opacity: 0.92;
    }

    .enter-btn {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 225, 172, 0.55);
      background: linear-gradient(135deg, rgba(255, 219, 151, 0.2), rgba(255, 180, 96, 0.28));
      color: #ffe9c8;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(255, 196, 102, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      backdrop-filter: blur(2px);
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.03);
      background: linear-gradient(135deg, rgba(255, 229, 179, 0.34), rgba(255, 184, 96, 0.4));
      box-shadow: 0 0 26px rgba(255, 208, 130, 0.45);
    }

    .enter-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .tiny-heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #ffd8a0, #ffc06b);
      transform: rotate(45deg);
      opacity: 0.78;
      pointer-events: none;
      border-radius: 4px;
      animation: rise linear forwards;
      box-shadow: 0 0 10px rgba(255, 208, 138, 0.45);
    }

    .tiny-heart::before,
    .tiny-heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: inherit;
      border-radius: 50%;
    }

    .tiny-heart::before { left: -9px; }
    .tiny-heart::after { top: -9px; }

    @keyframes rise {
      0% { transform: translateY(0) rotate(45deg) scale(0.7); opacity: 0; }
      15% { opacity: 0.9; }
      100% { transform: translateY(-110vh) rotate(45deg) scale(1.15); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="wrap">
    <div class="heart-scene">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <canvas id="heartCanvas"></canvas>
    </div>

    <h1>520 快乐</h1>
    <p class="msg">
      亲爱的<span class="highlight">宝贝</span>，<br />
      遇见你是我最幸运的事。<br />
      未来的每一天，都想和你一起发光发热。<br />
      <span class="highlight">我爱你，不止 520。</span>
    </p>
    <p class="footer">- 永远爱你的我 -</p>
    <a class="enter-btn" href="./love-letter.html">💌 点开有惊喜哟</a>
  </main>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const scene = document.querySelector(".heart-scene");
    const ctx = canvas.getContext("2d");
    const particles = [];
    const sparks = [];
    const targetPoints = [];

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x, y };
    }

    function setupCanvas() {
      const rect = scene.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildTargetPoints(rect.width, rect.height);
      initParticles(rect.width, rect.height);
    }

    function buildTargetPoints(w, h) {
      targetPoints.length = 0;
      const scale = Math.min(w, h) * 0.26;
      const cx = w * 0.5;
      const cy = h * 0.45;

      for (let i = 0; i < 1400; i += 1) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t);

        const thickness = 0.8 + Math.random() * 0.45;
        targetPoints.push({
          x: cx + p.x * scale * 0.06 * thickness,
          y: cy - p.y * scale * 0.06 * thickness
        });
      }
    }

    function initParticles(w, h) {
      particles.length = 0;
      sparks.length = 0;

      for (let i = 0; i < 1800; i += 1) {
        particles.push({
          x: Math.random() * w,
          y: h * (0.58 + Math.random() * 0.38),
          vx: 0,
          vy: 0,
          size: 0.8 + Math.random() * 2.2,
          glow: 0.55 + Math.random() * 0.45,
          offset: Math.random() * 1000
        });
      }

      for (let i = 0; i < 500; i += 1) {
        sparks.push({
          x: Math.random() * w,
          y: h * (0.65 + Math.random() * 0.35),
          size: 0.6 + Math.random() * 2.3,
          alpha: 0.2 + Math.random() * 0.55,
          twinkle: Math.random() * 1000
        });
      }
    }

    function drawHeartParticles(w, h, time) {
      const beat = 1 + Math.sin(time * 0.006) * 0.03 + Math.sin(time * 0.012) * 0.012;
      const cx = w * 0.5;
      const cy = h * 0.45;

      for (let i = 0; i < particles.length; i += 1) {
        const p = particles[i];
        const target = targetPoints[i % targetPoints.length];

        const tx = cx + (target.x - cx) * beat + Math.sin(time * 0.0018 + p.offset) * 1.1;
        const ty = cy + (target.y - cy) * beat + Math.cos(time * 0.0016 + p.offset) * 1.1;

        p.vx += (tx - p.x) * 0.028;
        p.vy += (ty - p.y) * 0.028;
        p.vx *= 0.86;
        p.vy *= 0.86;
        p.x += p.vx;
        p.y += p.vy;

        const blink = 0.6 + Math.sin(time * 0.01 + p.offset) * 0.4;
        const alpha = Math.max(0.16, p.glow * blink);

        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 219, 150, ${alpha.toFixed(3)})`;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBottomSparks(w, h, time) {
      for (let i = 0; i < sparks.length; i += 1) {
        const s = sparks[i];
        const tw = 0.55 + Math.sin(time * 0.004 + s.twinkle) * 0.45;
        const alpha = s.alpha * tw;

        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 215, 140, ${alpha.toFixed(3)})`;
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animateHeart(time) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      ctx.clearRect(0, 0, w, h);
      drawBottomSparks(w, h, time);
      drawHeartParticles(w, h, time);
      requestAnimationFrame(animateHeart);
    }

    function createTinyHeart() {
      const heart = document.createElement("span");
      heart.className = "tiny-heart";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.bottom = "-22px";

      const size = 10 + Math.random() * 16;
      const duration = 4 + Math.random() * 4;
      const drift = (Math.random() - 0.5) * 140;

      heart.style.width = size + "px";
      heart.style.height = size + "px";
      heart.style.animationDuration = duration + "s";
      heart.style.marginLeft = drift + "px";
      heart.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }

    setupCanvas();
    requestAnimationFrame(animateHeart);
    window.addEventListener("resize", setupCanvas);
    setInterval(createTinyHeart, 460);
  </script>
</body>
</html>
