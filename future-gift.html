<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>未来礼物</title>
  <style>
    :root {
      --bg1: #06080d;
      --bg2: #162033;
      --light: #b8d9ff;
      --text: #f3f8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 15%, #223a63 0%, var(--bg2) 34%, var(--bg1) 100%);
      overflow: hidden;
      padding: 16px;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    body.page-ready {
      opacity: 1;
      transform: scale(1);
    }

    body.page-leave {
      opacity: 0;
      transform: scale(0.99);
    }

    .card {
      width: min(92vw, 760px);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 36px);
      border: 1px solid rgba(186, 215, 255, 0.35);
      background: linear-gradient(160deg, rgba(210, 230, 255, 0.12), rgba(124, 166, 255, 0.11));
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 22px rgba(167, 206, 255, 0.2);
      backdrop-filter: blur(3px);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      font-size: clamp(1.75rem, 4.8vw, 2.8rem);
      letter-spacing: 2px;
      text-shadow: 0 0 18px rgba(184, 217, 255, 0.5);
      margin-bottom: 10px;
    }

    .sub {
      color: #d8eaff;
      opacity: 0.9;
      margin-bottom: 22px;
    }

    .laptop-wrap {
      margin: 8px auto 24px;
      width: min(78vw, 420px);
      animation: float 3.4s ease-in-out infinite;
      position: relative;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .screen {
      height: 230px;
      border-radius: 16px 16px 10px 10px;
      border: 2px solid rgba(196, 223, 255, 0.35);
      background: #020305;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 26px rgba(6, 10, 18, 0.8);
      position: relative;
      overflow: hidden;
    }

    .screen::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(220, 235, 255, 0.35);
      z-index: 6;
    }

    .boot-logo {
      position: absolute;
      inset: 0;
      background: url("./assets/apple-boot.png") center/contain no-repeat;
      filter: none;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.35s ease;
      z-index: 3;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 0.8s ease, transform 1.2s ease;
      z-index: 2;
    }

    .desktop-blur {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 15, 28, 0.18), rgba(8, 15, 28, 0.4));
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 3;
    }

    .lock-screen {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 4px;
      color: #eef7ff;
      background: linear-gradient(180deg, rgba(8, 16, 30, 0.06), rgba(8, 16, 30, 0.28));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .lock-time {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 1px;
      line-height: 1;
    }

    .lock-date {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .lock-tip {
      margin-top: 6px;
      font-size: 0.72rem;
      opacity: 0.9;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(215, 233, 255, 0.2);
      border: 1px solid rgba(236, 246, 255, 0.26);
    }

    .screen-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 28%, rgba(0, 0, 0, 0.26));
      opacity: 0;
      z-index: 8;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .desktop-ui {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 6;
      transition: opacity 0.55s ease;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 0.72rem;
      background: rgba(8, 16, 30, 0.52);
      color: #ebf4ff;
      backdrop-filter: blur(6px);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .desktop-icons {
      position: absolute;
      top: 34px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      color: #eff7ff;
      font-size: 0.62rem;
    }

    .desktop-icon {
      display: grid;
      justify-items: center;
      gap: 2px;
      width: 46px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.48);
    }

    .icon-box {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(214, 232, 255, 0.2);
      border: 1px solid rgba(234, 244, 255, 0.32);
      font-size: 0.95rem;
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 14px;
      background: rgba(18, 34, 58, 0.45);
      border: 1px solid rgba(223, 238, 255, 0.3);
      backdrop-filter: blur(8px);
    }

    .dock-item {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 0.9rem;
      background: rgba(222, 237, 255, 0.2);
      border: 1px solid rgba(239, 247, 255, 0.35);
    }

    .desktop-message {
      position: absolute;
      left: 10px;
      bottom: 38px;
      font-size: 0.72rem;
      color: #f0f8ff;
      background: rgba(11, 22, 38, 0.4);
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(228, 241, 255, 0.3);
      backdrop-filter: blur(6px);
    }

    .base {
      height: 22px;
      margin: 0 auto;
      width: 112%;
      transform: translateX(-6%);
      border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, #8ba7c9, #5a6f8b);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .power-btn {
      position: absolute;
      top: 4px;
      right: 18px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(235, 245, 255, 0.68);
      background: rgba(196, 222, 255, 0.2);
      box-shadow: 0 0 6px rgba(197, 223, 255, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .power-btn:hover {
      transform: scale(1.1);
      background: rgba(220, 238, 255, 0.46);
    }

    .power-hint {
      margin-top: 8px;
      font-size: 0.82rem;
      color: rgba(222, 238, 255, 0.72);
      letter-spacing: 0.5px;
    }

    .msg {
      font-size: clamp(1.03rem, 2.8vw, 1.25rem);
      line-height: 1.95;
      color: #ecf5ff;
    }

    .strong {
      color: #cde6ff;
      font-weight: 700;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .btn-main {
      color: #0c1b2d;
      background: linear-gradient(135deg, #dff0ff, #9fc8ff);
      box-shadow: 0 0 15px rgba(170, 212, 255, 0.4);
    }

    .btn-ghost {
      color: #e2f0ff;
      border: 1px solid rgba(190, 220, 255, 0.48);
      background: rgba(152, 196, 255, 0.12);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 20px rgba(175, 215, 255, 0.44);
    }

    .screen.booting .boot-logo {
      opacity: 1;
      transform: scale(1);
    }

    .screen.on .wallpaper {
      opacity: 1;
      transform: scale(1);
    }

    .screen.locked .lock-screen {
      opacity: 1;
      pointer-events: auto;
    }

    .screen.on .desktop-ui {
      opacity: 1;
      pointer-events: auto;
    }

    .screen.on .screen-overlay,
    .screen.on .desktop-blur {
      opacity: 1;
    }

    .screen.on .boot-logo {
      opacity: 0;
    }

  </style>
</head>
<body>
  <main class="card">
    <h1>未来礼物已预定 🎁</h1>
    <p class="sub">for 子欣 · 目标进行中</p>

    <div class="laptop-wrap">
      <div class="screen" id="screen">
        <img
          class="wallpaper"
          src="./assets/wallpaper-photo.png"
          alt="我们的合照"
        />
        <div class="desktop-blur"></div>
        <div class="boot-logo" aria-hidden="true"></div>
        <div class="lock-screen" id="lockScreen">
          <div class="lock-time" id="lockTime">22:20</div>
          <div class="lock-date" id="lockDate">星期一, 5月11日</div>
          <div class="lock-tip">点击任意位置进入桌面</div>
        </div>
        <div class="desktop-ui">
          <div class="topbar">
            <div class="topbar-left"><span></span><span>Finder</span><span>文件</span><span>编辑</span></div>
            <div class="topbar-right"><span>Wi-Fi</span><span>100%</span><span id="deskTime">22:20</span></div>
          </div>
          <div class="desktop-icons">
            <div class="desktop-icon"><div class="icon-box">📁</div><span>礼物计划</span></div>
            <div class="desktop-icon"><div class="icon-box">🖼️</div><span>我们</span></div>
          </div>
          <div class="desktop-message">欢迎回来，子欣 💙</div>
          <div class="dock">
            <div class="dock-item">🧭</div>
            <div class="dock-item">💬</div>
            <div class="dock-item">🎵</div>
            <div class="dock-item">🖼️</div>
            <div class="dock-item">⚙️</div>
          </div>
        </div>
        <div class="screen-overlay"></div>
      </div>
      <div class="base">
        <button class="power-btn" id="powerBtn" aria-label="power"></button>
      </div>
      <p class="power-hint">轻点右下角开机键 ✨</p>
    </div>

    <p class="msg">
      这是我偷偷准备的未来礼物页面。<br />
      现在先把这份心意写在这里，等我慢慢攒够，<br />
      就把真正的 <span class="strong">Apple 电脑</span> 送到你手里。<br />
      <span class="strong">你值得最好的，我会认真做到。💙</span>
    </p>

    <div class="actions">
      <a class="btn btn-main" href="./love-letter.html">💌 回到情书页</a>
      <a class="btn btn-ghost" href="./heart.html">✨ 回到爱心页</a>
    </div>
  </main>
  <script>
    const screen = document.getElementById("screen");
    const powerBtn = document.getElementById("powerBtn");
    const lockScreen = document.getElementById("lockScreen");
    const lockTime = document.getElementById("lockTime");
    const lockDate = document.getElementById("lockDate");
    const deskTime = document.getElementById("deskTime");
    let screenState = "off";
    let bootTimer = null;

    function updateDeskTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      deskTime.textContent = `${h}:${m}`;
      lockTime.textContent = `${h}:${m}`;

      const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      const month = now.getMonth() + 1;
      const day = now.getDate();
      lockDate.textContent = `${weekdays[now.getDay()]}, ${month}月${day}日`;
    }

    function powerOn() {
      if (screenState !== "off") return;
      screenState = "booting";
      screen.classList.add("booting");

      bootTimer = setTimeout(() => {
        screen.classList.remove("booting");
        screen.classList.add("locked");
        screenState = "locked";
      }, 2000);
    }

    function unlockToDesktop() {
      if (screenState !== "locked") return;
      screen.classList.remove("locked");
      screen.classList.add("on");
      screenState = "on";
    }

    function powerOff() {
      if (bootTimer) {
        clearTimeout(bootTimer);
        bootTimer = null;
      }
      screen.classList.remove("booting", "locked", "on");
      screenState = "off";
    }

    function smoothNavigate(url, delay = 420) {
      document.body.classList.add("page-leave");
      setTimeout(() => {
        window.location.href = url;
      }, delay);
    }

    powerBtn.addEventListener("click", () => {
      if (screenState === "off") {
        powerOn();
      } else {
        powerOff();
      }
    });

    lockScreen.addEventListener("click", unlockToDesktop);

    document.querySelectorAll("a[href]").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        const href = link.getAttribute("href");
        if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
        event.preventDefault();
        smoothNavigate(href);
      });
    });

    updateDeskTime();
    setInterval(updateDeskTime, 10000);
    requestAnimationFrame(() => {
      document.body.classList.add("page-ready");
    });
  </script>
</body>
</html>
